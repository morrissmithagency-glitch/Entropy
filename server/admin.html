<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CBC Helper affiliates</title>
<style>
  :root { --bg: #f6f3ec; --ink: #1d1a2e; --muted: #6b6578; --line: #e2dccf; --gold: #b07a1d; --ok: #2f7d4f; --bad: #a33a2b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  p.muted, .muted { color: var(--muted); }
  input, button { font: inherit; }
  input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--line); }
  .pill.approved { background: #dcefe3; color: var(--ok); }
  .pill.pending { background: #f6e7c8; color: var(--gold); }
  .pill.rejected, .pill.suspended { background: #f3d9d4; color: var(--bad); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  #msg { min-height: 1.4em; margin: 10px 0; }
  .login { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>CBC Helper affiliates</h1>
  <p class="muted" id="terms"></p>
  <div class="login">
    <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" />
    <button id="load" class="gold">Open</button>
  </div>
  <div id="msg"></div>
  <h2>Waiting for approval</h2>
  <div class="wrap"><table id="pending"></table></div>
  <h2>All affiliates</h2>
  <p class="muted">Payable = held for the waiting period and ready to send. Send the payable amount by M-Pesa to the affiliate's number, then record the receipt with “Paid out”.</p>
  <div class="wrap"><table id="all"></table></div>
  <h2 id="detail-h" hidden>Commissions</h2>
  <div class="wrap" id="detail-wrap" hidden><table id="detail"></table></div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  const ksh = (n) => 'KSh ' + Number(n).toLocaleString('en-KE')
  const date = (t) => (t ? new Date(t).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' }) : '')
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const phone = (p) => '0' + String(p).slice(3)
  try { $('token').value = sessionStorage.getItem('cbc-admin') || '' } catch {}

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { Authorization: 'Bearer ' + $('token').value, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    })
    const json = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(json.error || 'Request failed')
    return json
  }
  const say = (t, bad) => { $('msg').textContent = t; $('msg').style.color = bad ? 'var(--bad)' : 'var(--ok)' }

  async function load() {
    try { sessionStorage.setItem('cbc-admin', $('token').value) } catch {}
    try {
      const { affiliates, terms } = await api('/api/admin/affiliates')
      $('terms').textContent = `First payment ${terms.firstRate * 100}% · renewals ${terms.renewalRate.week * 100}% weekly, ${terms.renewalRate.month * 100}% monthly for ${terms.renewalDays} days · held ${terms.holdDays} days · minimum payout ${ksh(terms.minPayout)} · applicants ${terms.minAge}+`
      const head = '<tr><th>Name</th><th>ID number</th><th>Born</th><th>M-Pesa</th><th>Code</th><th>Status</th><th>Parents</th><th>Held</th><th>Payable</th><th>Paid</th><th></th></tr>'
      const row = (a) => `<tr><td>${esc(a.name)}</td><td>${esc(a.idNumber)}</td><td>${esc(a.dob)}</td><td>${phone(a.phone)}</td><td><strong>${esc(a.code)}</strong></td>
        <td><span class="pill ${a.status}">${a.status}</span></td><td class="num">${a.parents}</td>
        <td class="num">${ksh(a.balance.held)}</td><td class="num">${ksh(a.balance.payable)}</td><td class="num">${ksh(a.balance.paid)}</td>
        <td><div class="row-actions">
          ${a.status !== 'approved' ? `<button class="ok" data-act="approved" data-id="${a.id}">Approve</button>` : ''}
          ${a.status === 'pending' ? `<button class="bad" data-act="rejected" data-id="${a.id}">Reject</button>` : ''}
          ${a.status === 'approved' ? `<button class="bad" data-act="suspended" data-id="${a.id}">Suspend</button>` : ''}
          ${a.balance.payable >= terms.minPayout ? `<button class="gold" data-pay="${a.id}" data-amt="${a.balance.payable}" data-phone="${a.phone}">Paid out</button>` : ''}
          <button data-list="${a.id}" data-name="${esc(a.name)}">Commissions</button>
          <button data-key="${a.id}">New key</button>
        </div></td></tr>`
      const pending = affiliates.filter((a) => a.status === 'pending')
      $('pending').innerHTML = pending.length ? head + pending.map(row).join('') : '<tr><td class="muted">No new applications.</td></tr>'
      $('all').innerHTML = affiliates.length ? head + affiliates.map(row).join('') : '<tr><td class="muted">No affiliates yet.</td></tr>'
    } catch (e) { say(e.message, true) }
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button')
    if (!b) return
    try {
      if (b.id === 'load') return load()
      if (b.dataset.act) {
        await api(`/api/admin/affiliates/${b.dataset.id}`, { status: b.dataset.act })
        say('Saved.')
      } else if (b.dataset.pay) {
        const receipt = prompt(`Send ${ksh(b.dataset.amt)} to ${phone(b.dataset.phone)} by M-Pesa, then enter the M-Pesa receipt:`)
        if (!receipt) return
        const out = await api('/api/admin/payouts', { affiliateId: b.dataset.pay, receipt })
        say(`Recorded payout of ${ksh(out.total)}.`)
      } else if (b.dataset.key) {
        if (!confirm('Make a new key? The old one stops working.')) return
        const { key } = await api(`/api/admin/affiliates/${b.dataset.key}/key`, {})
        prompt('New key. Send it to the affiliate privately:', key)
      } else if (b.dataset.list) {
        const { commissions } = await api(`/api/admin/affiliates/${b.dataset.list}/commissions`)
        $('detail-h').hidden = $('detail-wrap').hidden = false
        $('detail-h').textContent = 'Commissions: ' + b.dataset.name
        $('detail').innerHTML = '<tr><th>Date</th><th>Parent</th><th>Plan</th><th>Paid</th><th>Kind</th><th>Rate</th><th>Commission</th><th>Status</th><th></th></tr>' +
          (commissions.map((c) => `<tr><td>${date(c.at)}</td><td>${phone(c.phone)}</td><td>${esc(c.plan)}</td><td class="num">${ksh(c.amount)}</td><td>${c.kind}</td><td class="num">${Math.round(c.rate * 100)}%</td><td class="num">${ksh(c.commission)}</td><td>${c.status}</td>
            <td>${c.status === 'open' ? `<button class="bad" data-void="${c.id}">Void</button>` : ''}</td></tr>`).join('') || '<tr><td class="muted">None yet.</td></tr>')
        return
      } else if (b.dataset.void) {
        if (!confirm('Void this commission? Use this when the payment was reversed or was fraud.')) return
        await api(`/api/admin/commissions/${b.dataset.void}/void`, {})
        say('Voided.')
      } else return
      load()
    } catch (err) { say(err.message, true) }
  })
  if ($('token').value) load()
</script>
</body>
</html>
